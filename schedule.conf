# 서버(로컬) 시간 기준. 수정 후 다음 확인 주기부터 반영
START_TIMES="09:00 14:00 19:00 00:00"
QUIET_START="05:00"
QUIET_END="09:00"

# 예약 시각 이후 이 시간 안에만 전송함 (창 상태와 무관하게 예약당 1회)
# 늦게 컴퓨터를 켰다면 이 시간을 넘긴 예약은 건너뜀
